name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.14"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: make test
